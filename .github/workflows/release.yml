# Releases the @patina-ui/* packages to npm with Changesets.
#
# - Pending changesets on main → opens/updates a "Version Packages" PR (versions + changelogs).
# - Merging that PR → publishes the new versions to npm, then moves the GitHub Action's
#   `v0` tag (and adds `action-v<version>`) so `uses: …/packages/action@v0` gets the update.
#
# Needs the NPM_TOKEN secret (a granular npm token with publish rights on @patina-ui).
# Provenance is turned on automatically once the repository is public.
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # version PR commits, tags
  pull-requests: write # the "Version Packages" PR
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip until npm is set up
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN isn't set, so nothing is released. See docs/releasing.md (one-time setup)."
      - uses: actions/checkout@v4
        if: env.NPM_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        if: env.NPM_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        if: env.NPM_TOKEN != ''

      - id: changesets
        if: env.NPM_TOKEN != ''
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "Version Packages"
          commit: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}

      - name: Move the GitHub Action's major-version tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          major="v${version%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major"
          git tag "action-v$version"
          git push origin "$major" "action-v$version" --force
