# Releases the @patina-ui/* packages to npm with Changesets.
#
# - Pending changesets on main → opens/updates a "Version Packages" PR (versions + changelogs).
# - Merging that PR → publishes the new versions to npm, then moves the GitHub Action's
#   `v0` tag (and adds `action-v<version>`) so `uses: …/packages/action@v0` gets the update.
#
# Needs the NPM_TOKEN secret (a granular npm token with publish rights on @patina-ui).
# Publishes with npm provenance (`pnpm release:ci` passes --provenance; needs id-token: write).
# It's a flag on purpose: pnpm 11+ ignores provenance in .npmrc and npm_config_* variables,
# and `changeset publish` calls `pnpm publish` with fixed flags.
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # version PR commits, tags
  pull-requests: write # the "Version Packages" PR
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip until npm is set up
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN isn't set, so nothing is released. See docs/releasing.md (one-time setup)."
      - uses: actions/checkout@v4
        if: env.NPM_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        if: env.NPM_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        if: env.NPM_TOKEN != ''

      # npm can take minutes to show a new version. A push right after a release would otherwise
      # see the packages as unpublished and try (and fail) to publish them again.
      - id: released
        if: env.NPM_TOKEN != ''
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          pending=$(ls .changeset/*.md 2>/dev/null | grep -v README.md | wc -l)
          if [ "$pending" = "0" ] && [ -n "$(git ls-remote --tags origin "refs/tags/@patina-ui/core@$version")" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$version is already released and no changesets are pending."
          fi

      - id: changesets
        if: env.NPM_TOKEN != '' && steps.released.outputs.skip != 'true'
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release:ci
          title: "Version Packages"
          commit: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # changeset publish tags the published versions locally; push them. Also tag the Action
      # (`action-v<version>`, and move the `v<major>` tag users pin) once per version.
      # Both steps are idempotent, so they don't depend on detecting what was published.
      - name: Push release tags
        if: env.NPM_TOKEN != '' && steps.released.outputs.skip != 'true'
        run: |
          git push origin --tags
          version=$(node -p "require('./packages/core/package.json').version")
          if [ -z "$(git ls-remote --tags origin "refs/tags/action-v$version")" ] && \
             git rev-parse -q --verify "refs/tags/@patina-ui/core@$version" >/dev/null; then
            # changeset publish creates that tag only after publishing (npm itself can lag minutes).
            major="v${version%%.*}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$major"
            git tag "action-v$version"
            git push origin "action-v$version"
            git push origin "$major" --force
          fi
