name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck # includes examples/quickstart (the README quick start) and the demo
      - run: pnpm test # unit, property, storage contract (PGlite), handler, React
      - run: pnpm build
      - name: Action bundle is up to date
        run: git diff --exit-code -- packages/action/dist
      - name: Demo's data catalog matches its code
        run: node packages/cli/bin/patina.js check --root examples/demo --fail-on changed
      - name: API reference is up to date
        run: pnpm docs:api && git diff --exit-code -- docs/reference
      - name: Eval set runs (offline baseline, no API key)
        run: pnpm eval --model offline --concurrency 8
